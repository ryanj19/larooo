<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hidden Objects Game</title>
    <link rel="icon" type="image" href="./bigh.png">

    <style>
        body {
            overflow: hidden;
            position: relative;
            margin: 0;
            padding: 0;
            background-color: #f0f0f0;
            -webkit-user-drag: none;
            user-drag: none;
        }

        img {
            width: 1000px;
            height: 992px;
            max-height: 992px;
            object-fit: cover;
            position: relative;
            z-index: 0;
            display: block;
            margin: 0 auto;
            margin-top: -1px;
            -webkit-user-drag: none;
            user-select: none;
        }

        .game-container {
            position: relative;
            width: 100%;
            height: auto;
            margin: 0 auto;
        }

        .heart1,
        .heart2,
        .heart3,
        .heart4,
        .heart5,
        .heart6,
        .heart7 {
            z-index: 2;
            transition: opacity 3.3s ease;
        }

        .heart1 {
            width: 150px;
            height: 150px;
            opacity: 0;
            position: absolute;
            bottom: 153px;
            left: 544px;
            border-radius: 50%;
            background-color: rgba(0, 128, 0, 0.5);
            box-shadow: 0 0 50px 50px rgb(217, 255, 0);
        }

        .heart2 {
            width: 50px;
            height: 50px;
            opacity: 0;
            position: absolute;
            top: 195.5px;
            left: 958px;
            border-radius: 50%;
            background-color: rgba(0, 128, 0, 0.5);
            box-shadow: 0 0 30px 25px rgb(217, 255, 0);
        }

        .heart3 {
            width: 70px;
            height: 70px;
            opacity: 0;
            position: absolute;
            bottom: 285px;
            left: 1095.5px;
            border-radius: 50%;
            background-color: rgba(0, 128, 0, 0.5);
            box-shadow: 0 0 40px 40px rgb(217, 255, 0);
        }

        .heart4 {
            width: 75px;
            height: 75px;
            opacity: 0;
            position: absolute;
            top: 260px;
            left: 634px;
            border-radius: 50%;
            background-color: rgba(0, 128, 0, 0.5);
            box-shadow: 0 0 35px 30px rgb(217, 255, 0);
        }

        .heart5 {
            width: 100px;
            height: 100px;
            opacity: 0;
            position: absolute;
            top: 348px;
            left: 918.3px;
            border-radius: 50%;
            background-color: rgba(0, 128, 0, 0.5);
            box-shadow: 0 0 35px 30px rgb(217, 255, 0);
        }

        .heart6 {
            width: 90px;
            height: 90px;
            opacity: 0;
            position: absolute;
            top: 258px;
            left: 1327px;
            border-radius: 50%;
            background-color: rgba(0, 128, 0, 0.5);
            box-shadow: 0 0 35px 30px rgb(217, 255, 0);
        }

        .heart7 {
            width: 145px;
            height: 145px;
            opacity: 0;
            position: absolute;
            bottom: 79px;
            left: 1310px;
            border-radius: 50%;
            background-color: rgba(0, 128, 0, 0.5);
            box-shadow: 0 0 35px 30px rgb(217, 255, 0);
        }

        .heart1.active,
        .heart2.active,
        .heart3.active,
        .heart4.active,
        .heart5.active,
        .heart6.active,
        .heart7.active {
            opacity: 100%;
        }

        .heart1.active::after,
        .heart2.active::after,
        .heart3.active::after,
        .heart4.active::after,
        .heart5.active::after,
        .heart6.active::after,
        .heart7.active::after {
            content: "";
            position: absolute;
            inset: 0;
            border-radius: 50%;
            border: 4px solid red;
            box-shadow:
                0 0 15px red,
                0 0 30px red;
            animation: foundPulse 1s infinite alternate;
        }

        @keyframes foundPulse {
            from {
                transform: scale(0.9);
                opacity: 0.5;
            }

            to {
                transform: scale(1.1);
                opacity: 1;
            }
        }

        #musicBtn {
            position: fixed;
            bottom: 15px;
            left: 340px;
            z-index: 10;
            padding: 10px 15px;
            font-size: 16px;
            font-family: "Press Start 2P", monospace;
            border: none;
            border-radius: 8px;
            background: #222;
            color: #fff;
            cursor: pointer;
            box-shadow: 0px 0px 10px rgba(0,0,0,0.5);
            transition: background 0.2s ease;
        }

        #musicBtn:hover {
            background: #444;
        }

        /* =========================
           RED SPARK CURSOR
        ========================= */

        .spark {
            position: fixed;
            width: 6px;
            height: 6px;
            background: red;
            border-radius: 50%;
            pointer-events: none;
            z-index: 9999;
            box-shadow:
                0 0 6px red,
                0 0 12px red;
            animation: sparkMove 500ms ease-out forwards;
        }

        @keyframes sparkMove {
            0% {
                transform: translate(0, 0) scale(1);
                opacity: 1;
            }

            100% {
                transform:
                    translate(
                        var(--x),
                        var(--y)
                    )
                    scale(0);
                opacity: 0;
            }
        }
    </style>
</head>

<body>

    <div class="game-container">

        <audio id="bgmusic" src="./hidden.mp3" loop></audio>

        <img src="./redgame.png">

        <div class="heart1"></div>
        <div class="heart2"></div>
        <div class="heart3"></div>
        <div class="heart4"></div>
        <div class="heart5"></div>
        <div class="heart6"></div>
        <div class="heart7"></div>

    </div>

    <button id="musicBtn">🔇 Music</button>

    <audio id="clicksound" src="./reward.mp3" preload="auto"></audio>

    <script>

        const bgmusic = document.getElementById("bgmusic");
        const musicBtn = document.getElementById("musicBtn");

        let musicPlaying = false;

        musicBtn.addEventListener("click", () => {

            if (musicPlaying) {

                bgmusic.pause();
                musicBtn.textContent = "🔇 Music";
                musicPlaying = false;

            } else {

                bgmusic.play();
                musicBtn.textContent = "🔊 Music";
                musicPlaying = true;

            }

        });

        let foundCount = 0;
        const totalHearts = 7;

        const clicksound = document.getElementById("clicksound");

        function markFound(element) {

            if (!element.classList.contains("active")) {

                element.classList.add("active");

                foundCount++;

                clicksound.currentTime = 0;
                clicksound.volume = 1.0;
                clicksound.play();

                if (foundCount === totalHearts) {

                    setTimeout(() => {

                        alert("Wow congrats! wait ka muna");

                    }, 2000);

                    setTimeout(() => {

                        window.location.href = "yellowgame.html";

                    }, 7000);
                }
            }
        }


        document.querySelector(".heart1")
            .addEventListener("click", function() {
                markFound(this);
            });

        document.querySelector(".heart2")
            .addEventListener("click", function() {
                markFound(this);
            });

        document.querySelector(".heart3")
            .addEventListener("click", function() {
                markFound(this);
            });

        document.querySelector(".heart4")
            .addEventListener("click", function() {
                markFound(this);
            });

        document.querySelector(".heart5")
            .addEventListener("click", function() {
                markFound(this);
            });

        document.querySelector(".heart6")
            .addEventListener("click", function() {
                markFound(this);
            });

        document.querySelector(".heart7")
            .addEventListener("click", function() {
                markFound(this);
            });

        document.addEventListener("click", function(event) {

            for (let i = 0; i < 8; i++) {

                const spark = document.createElement("div");

                spark.className = "spark";

                spark.style.left = event.clientX + "px";
                spark.style.top = event.clientY + "px";

                const angle = Math.random() * Math.PI * 2;
                const distance = Math.random() * 40 + 20;

                const x = Math.cos(angle) * distance;
                const y = Math.sin(angle) * distance;
              
                spark.style.setProperty("--x", x + "px");
                spark.style.setProperty("--y", y + "px");

                document.body.appendChild(spark);

                setTimeout(() => {
                    spark.remove();
                }, 500);
            }
        });

    </script>

</body>
</html>
